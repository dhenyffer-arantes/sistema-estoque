version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: estoque_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: estoque_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: estoque_backend_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=postgres
    env_file:
      - .env
    depends_on:
      - postgres
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

volumes:
  pgdata: